[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studienhelfer"
version = "0.1.0"
description = "AI-powered study assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi",
    "numpy>=2.4.6",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.52",
    "trafilatura>=2.2.0",
    "uvicorn[standard]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
